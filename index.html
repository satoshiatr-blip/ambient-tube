<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IMMERSE">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>IMMERSE</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #000; color: #eee; font-family: -apple-system, "Hiragino Sans", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }

  /* 背景レイヤー: 中身は w×h の動画1本。外枠の transform で壁や光に変形する */
  .layer { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; pointer-events: none; opacity: 0; transition: opacity .8s; }
  .layer.on { opacity: 1; }
  /* 停止中の背景プレーヤーにはYouTubeのボタンやロゴが出るので、照明が点いている間はサムネイルに切り替える */
  .media iframe { transition: opacity .6s; }
  body.lit .media iframe { opacity: 0 !important; }
  .layer.on.dip { opacity: .3; transition: opacity .2s; }
  .media { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); transform-origin: 0 0; }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media > div, .media iframe { position: absolute; left: 0; top: 0; width: 320px; height: 180px; border: 0; transform: scale(var(--k)); transform-origin: 0 0; }
  .shade { position: absolute; inset: 0; }

  #room { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #main { position: absolute; background: #000; z-index: 2; }
  #main > div, #main iframe { width: 100%; height: 100%; border: 0; display: block; }
  #lights { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 1.8s ease;
            background: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,232,200,.22), rgba(255,232,200,0) 70%), rgba(0,0,0,.5); }
  body.lit #lights { opacity: 1; transition-duration: .9s; }

  /* 自前の操作パネル。最初の再生だけはYouTube側の再生ボタンを押させる（iOSは音付き再生に直接のタップが要る） */
  #ctl { position: absolute; inset: 0; z-index: 3; display: none; }
  #ctl.armed { display: block; }
  #ctl .ui { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #ctl.show .ui { opacity: 1; pointer-events: auto; }
  #ctl .row { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 28px; align-items: center; }
  #ctl .row button { width: 52px; height: 52px; border-radius: 50%; padding: 0; background: rgba(0,0,0,.45); font-size: 15px; }
  #ctl .row #pp { width: 68px; height: 68px; font-size: 24px; background: rgba(255,255,255,.92); color: #000; }
  #ctl .seek { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; gap: 10px; align-items: center; font: 12px ui-monospace, monospace; }
  #ctl .seek input { flex: 1; accent-color: #fff; }

  #bar { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 10px calc(env(safe-area-inset-left) + 12px);
         display: flex; gap: 8px; align-items: center; background: linear-gradient(rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .4s, transform .4s; z-index: 10; }
  #bar.hide { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  #url { flex: 1; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid #333; background: rgba(20,20,20,.9); color: #fff; padding: 0 12px; font-size: 16px; }
  button { height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #2a2a2a; color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; }
  button.primary { background: #fff; color: #000; }
  #settings { position: fixed; right: calc(env(safe-area-inset-right) + 12px); top: calc(env(safe-area-inset-top) + 60px); width: 250px; padding: 14px; border-radius: 14px; background: rgba(24,24,24,.95); z-index: 11; display: none; font-size: 13px; }
  #settings.open { display: block; }
  #settings label { display: block; margin: 4px 0 12px; }
  #settings input[type=range] { width: 100%; }
  .seg { display: flex; gap: 6px; margin: 6px 0 14px; }
  .seg button { flex: 1; height: 34px; font-size: 13px; }
  .seg button.sel { background: #fff; color: #000; }
  #msg { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: rgba(30,30,30,.95); font-size: 13px; z-index: 12; display: none; max-width: 90vw; text-align: center; }
  #debug { position: fixed; left: 8px; bottom: 8px; font: 11px ui-monospace, monospace; color: #8f8; background: rgba(0,0,0,.6); padding: 4px 6px; border-radius: 6px; z-index: 12; display: none; }
  #rotate { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: rgba(0,0,0,.82); font-size: 15px; text-align: center; line-height: 1.7; }
  #rotate .icon { font-size: 44px; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body:not(.portrait-ok) #rotate { display: flex; } }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #888; font-size: 14px; line-height: 1.8; padding: 24px; }
</style>
</head>
<body class="lit">
<div id="stage">
  <div id="layers"></div>
  <svg id="room" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gCeil" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#000"/></linearGradient>
      <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202024"/><stop offset="1" stop-color="#000"/></linearGradient>
    </defs>
    <polygon id="ceil" fill="url(#gCeil)"/>
    <polygon id="floor" fill="url(#gFloor)"/>
    <g id="edges" stroke="rgba(255,255,255,.10)" stroke-width="1" fill="none"></g>
  </svg>
  <div id="lights"></div>
  <div id="main"><div id="empty">YouTubeのURLを上に貼り付けてください<br>共有 →「リンクをコピー」で取れます</div><div id="mainHost"></div>
    <div id="ctl"><div class="ui">
      <div class="row"><button id="back" aria-label="10秒戻る">-10</button><button id="pp" aria-label="再生/一時停止">▶</button><button id="fwd" aria-label="10秒進む">+10</button></div>
      <div class="seek"><span id="cur">0:00</span><input id="pos" type="range" min="0" max="1" step="0.1" value="0"><span id="dur">0:00</span></div>
    </div></div>
  </div>
</div>
<div id="bar">
  <input id="url" type="url" inputmode="url" placeholder="YouTubeのURL" autocomplete="off">
  <button id="paste">貼り付け</button>
  <button id="load" class="primary">再生</button>
  <button id="gear" aria-label="設定">⚙</button>
</div>
<div id="settings">
  表示
  <div class="seg"><button data-mode="wrap">WRAP</button><button data-mode="ambient">AMBIENT</button></div>
  光の強さ<label><input id="glowR" type="range" min="0.2" max="1.4" step="0.05"></label>
  ぼかし<label><input id="blurR" type="range" min="0" max="1" step="0.05"></label>
  画面の大きさ<label><input id="sizeR" type="range" min="0.4" max="0.95" step="0.01"></label>
  <label><input id="cfC" type="checkbox"> 天井と床にも映す（重いときはオフ）</label>
  <label><input id="debugC" type="checkbox"> 同期の状態を表示</label>
</div>
<div id="rotate"><div class="icon">📱</div><div>iPhoneを横向きにすると<br>映像に包まれます</div><button id="portraitOk">縦のまま見る</button></div>
<div id="msg"></div>
<div id="debug"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('ambient:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ambient:' + k, JSON.stringify(v)); } catch {} },
};
const cfg = { cf: store.get('cf', true), mode: store.get('mode', 'wrap') === 'ambient' ? 'ambient' : 'wrap', glow: store.get('glow2', 1), blur: store.get('blur', 0.35), size: store.get('size2', 0.6) };

// 長方形(0,0)-(W,H) を四角形 q=[左上,右上,右下,左下] へ写す射影変換
function quadMatrix(W, H, q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3;
  const dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (dx3 * dy2 - dx2 * dy3) / den, h = (dx1 * dy3 - dx3 * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + h * x3, d = y1 - y0 + g * y1, e = y3 - y0 + h * y3;
  return `matrix3d(${a / W},${d / W},0,${g / W},${b / H},${e / H},0,${h / H},0,0,1,0,${x0},${y0},0,1)`;
}

// 背景レイヤーの定義。mirror: 映像の端を鏡写しにして継ぎ目なく外へ伸ばす
const CROP = 0.3;
const LAYOUTS = {
  wrap: [{ key: 'left' }, { key: 'right' }, { key: 'top', cf: true }, { key: 'bottom', cf: true }],
  ambient: [{ key: 'fill' }],
};

let geo = {};
function layout() {
  const vw = innerWidth, vh = innerHeight;
  const w = Math.min(vw * cfg.size, vh * cfg.size * 16 / 9), h = w * 9 / 16;
  const L = (vw - w) / 2, T = (vh - h) / 2, R = L + w, B = T + h;
  geo = { vw, vh, w, h, L, T, R, B };
  const root = document.documentElement.style;
  root.setProperty('--w', w + 'px');
  root.setProperty('--h', h + 'px');
  root.setProperty('--k', w / 320);
  Object.assign($('main').style, { left: L + 'px', top: T + 'px', width: w + 'px', height: h + 'px' });

  const blurPx = cfg.blur * w * 0.05;
  for (const el of document.querySelectorAll('.layer')) {
    const key = el.dataset.key, media = el.querySelector('.media'), shade = el.querySelector('.shade');
    if (key === 'left' || key === 'right') {
      // 切り出す幅。遠近が強いほど広く取らないと、はみ出した部分がカメラの後ろに回り描画されなくなる
      const m = 4, ratio = (vh + 2 * m) / h, sw = w * Math.min(1, Math.max(0.35, (ratio - 1) / ratio + 0.15));
      el.style.width = sw + 'px'; el.style.height = h + 'px';
      // 壁: 外側の辺は画面の四隅まで、内側の辺は主画面の縁に接する
      el.style.transform = key === 'left'
        ? quadMatrix(sw, h, [[-m, -m], [L, T], [L, B], [-m, vh + m]])
        : quadMatrix(sw, h, [[R, T], [vw + m, -m], [vw + m, vh + m], [R, B]]);
      media.style.transform = key === 'left' ? `translateX(${sw}px) scaleX(-1)` : `translateX(${w}px) scaleX(-1)`;
      el.style.filter = `blur(${blurPx * 0.5}px) saturate(1.35) brightness(${0.55 + 0.45 * cfg.glow})`;
      shade.style.background = `linear-gradient(to ${key === 'left' ? 'right' : 'left'}, rgba(0,0,0,${0.75 - 0.35 * Math.min(cfg.glow, 1)}), rgba(0,0,0,0) 85%)`;
    } else if (key === 'top' || key === 'bottom') {
      // 天井・床: 映像の上端/下端を鏡写しにし、主画面の縁から継ぎ目なく続ける
      const m = 4, c = 0, ratio = (vw + 2 * m) / w, sh = h * Math.min(1, Math.max(0.35, (ratio - 1) / ratio + 0.15));
      el.style.width = w + 'px'; el.style.height = sh + 'px';
      el.style.transform = key === 'top'
        ? quadMatrix(w, sh, [[-m, -m], [vw + m, -m], [R, T], [L, T]])
        : quadMatrix(w, sh, [[L, B], [R, B], [vw + m, vh + m], [-m, vh + m]]);
      media.style.transform = key === 'top' ? `translateY(${sh + c}px) scaleY(-1)` : `translateY(${h - c}px) scaleY(-1)`;
      if (key === 'top') {
        el.style.filter = `blur(${blurPx * 0.5}px) saturate(1.3) brightness(${0.4 + 0.35 * cfg.glow})`;
        shade.style.background = `linear-gradient(to bottom, rgba(0,0,0,${0.85 - 0.3 * Math.min(cfg.glow, 1)}), rgba(0,0,0,.1) 90%)`;
      } else {
        el.style.filter = `blur(${blurPx * 0.12 + 0.5}px) saturate(1.1) brightness(${0.45 + 0.4 * cfg.glow})`;
        shade.style.background = `linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,${0.55 - 0.2 * Math.min(cfg.glow, 1)}) 55%, rgba(0,0,0,.15))`;
      }
    } else {
      // アンビエント: 主画面の後ろで画面いっぱいに引き伸ばして光らせる
      const sx = vw * 1.08 / w, sy = vh * 1.12 / h;
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.transform = `translate(${vw / 2}px, ${vh / 2}px) scale(${sx}, ${sy}) translate(${-w / 2}px, ${-h / 2}px)`;
      media.style.transform = `translateY(${-h * CROP / 2}px) scaleY(${1 + CROP})`;
      el.style.filter = `blur(${(blurPx * 1.6 + 6) / Math.min(sx, sy)}px) saturate(1.7) brightness(${0.5 + 0.55 * cfg.glow})`;
      shade.style.background = `radial-gradient(ellipse ${w / vw * 70 + 30}% ${h / vh * 70 + 30}% at center, rgba(0,0,0,0) 40%, rgba(0,0,0,${0.85 - 0.3 * Math.min(cfg.glow, 1)}) 100%)`;
    }
  }

  const sx = cfg.mode === 'wrap';
  const pts = a => a.map(p => p.join(',')).join(' ');
  $('ceil').setAttribute('points', sx && !cfg.cf ? pts([[0, 0], [vw, 0], [R, T], [L, T]]) : '');
  $('floor').setAttribute('points', sx && !cfg.cf ? pts([[0, vh], [vw, vh], [R, B], [L, B]]) : '');
  $('edges').innerHTML = sx ? [[0, 0, L, T], [vw, 0, R, T], [0, vh, L, B], [vw, vh, R, B]].map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`).join('') : '';
  $('main').style.boxShadow = sx ? '0 0 0 1px rgba(255,255,255,.08)' : `0 0 ${w * 0.04}px rgba(0,0,0,.6)`;
}
// iPhoneは回転直後に古い画面幅を返すことがあるので、少し待って測り直す
const relayout = () => { layout(); setTimeout(layout, 300); setTimeout(layout, 1000); };
addEventListener('resize', relayout);
addEventListener('orientationchange', relayout);
window.visualViewport?.addEventListener('resize', relayout);

function buildLayers() {
  const host = $('layers');
  host.innerHTML = '';
  for (const { key, cf } of LAYOUTS[cfg.mode]) {
    if (cf && !cfg.cf) continue;
    const el = document.createElement('div');
    el.className = 'layer'; el.dataset.key = key;
    el.innerHTML = `<div class="media"><img alt=""><div></div></div><div class="shade"></div>`;
    host.appendChild(el);
  }
  for (const b of document.querySelectorAll('.seg button')) b.classList.toggle('sel', b.dataset.mode === cfg.mode);
  layout();
}

for (const [id, key, sk] of [['glowR', 'glow', 'glow2'], ['blurR', 'blur', 'blur'], ['sizeR', 'size', 'size2']]) {
  $(id).value = cfg[key];
  $(id).addEventListener('input', e => { cfg[key] = +e.target.value; store.set(sk, cfg[key]); layout(); });
}
for (const b of document.querySelectorAll('.seg button')) b.onclick = () => {
  if (cfg.mode === b.dataset.mode) return;
  cfg.mode = b.dataset.mode; store.set('mode', cfg.mode);
  rebuildBgs();
};
$('cfC').checked = cfg.cf;
$('cfC').onchange = e => {
  cfg.cf = e.target.checked; store.set('cf', cfg.cf);
  if (cfg.mode === 'wrap') rebuildBgs();
};
$('portraitOk').onclick = () => document.body.classList.add('portrait-ok');
let debugOn = false;
$('debugC').onchange = e => { debugOn = e.target.checked; $('debug').style.display = debugOn ? 'block' : 'none'; };
$('gear').onclick = () => { $('settings').classList.toggle('open'); settingsOpen() ? clearTimeout(uiTimer) : pokeUi(); };

function toast(t, ms = 3500) {
  const m = $('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', ms);
}

function parseId(s) {
  s = (s || '').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname.endsWith('youtu.be')) return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/);
    if (m) return m[1];
  } catch {}
  return null;
}

let main = null, bgs = [], apiReady = null, syncTimer = null, curId = null;
function loadApi() {
  return apiReady ??= new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
}

async function play(id, start = 0, autoplay = true) {
  curId = id;
  store.set('last', id);
  $('empty').style.display = 'none';
  await loadApi();
  main?.destroy(); destroyBgs();
  $('ctl').classList.remove('armed', 'show');
  document.body.classList.add('lit');
  clearInterval(syncTimer);
  $('mainHost').replaceWith(Object.assign(document.createElement('div'), { id: 'mainHost' }));
  main = new YT.Player('mainHost', {
    videoId: id, playerVars: { ...playerVars(start), autoplay: autoplay ? 1 : 0, controls: 0, fs: 0, iv_load_policy: 3, disablekb: 1 },
    events: { onStateChange: onMainState, onError: onMainError, onPlaybackRateChange: e => bgs.forEach(b => b.p.setPlaybackRate?.(e.data)) },
  });
  createBgs(id, start);
  syncTimer = setInterval(sync, 500);
  warnDataOnce();
}

const playerVars = start => ({ playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin, start: Math.floor(start) });
function destroyBgs() { bgs.forEach(b => { clearTimeout(b.dipT); b.p.destroy(); }); bgs = []; }

function createBgs(id, start) {
  bgs = [...document.querySelectorAll('.layer')].map(el => {
    const media = el.querySelector('.media');
    media.querySelector('img').src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    const slot = document.createElement('div');
    media.querySelector('div').replaceWith(slot);
    const b = { el, playing: false, lead: 0.3, hold: 0, checked: true, fails: 0, dead: false };
    b.p = new YT.Player(slot, {
      videoId: id, playerVars: { ...playerVars(start), controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, mute: 1 },
      events: {
        onReady: e => e.target.mute(),
        onError: () => giveUp(b),
        onStateChange: e => {
          b.playing = e.data === YT.PlayerState.PLAYING;
          if (b.playing) b.fails = 0;
          if (b.playing) { clearTimeout(b.dipT); b.dipT = setTimeout(() => b.el.classList.remove('dip'), 300); }
          b.p.getIframe().style.opacity = b.playing || e.data === YT.PlayerState.PAUSED ? 1 : 0; },
      },
    });
    b.p.getIframe().style.opacity = 0;
    el.classList.add('on');
    return b;
  });
}

// 表示モードや天井・床の切替。中央は止めずに背景だけ作り直す
function rebuildBgs() {
  destroyBgs();
  buildLayers();
  if (!curId || !main?.getCurrentTime) return;
  const t = main.getCurrentTime();
  createBgs(curId, t);
  if (isPlaying()) setTimeout(() => bgs.forEach(b => b.p.seekTo && seekBg(b, main.getCurrentTime())), 1500);
}

// 3: 何度試しても動かない背景は同期をやめ、静止画のままにする
function giveUp(b) {
  if (b.dead) return;
  b.dead = true;
  b.el.classList.remove('dip');
  const f = b.p.getIframe?.();
  if (f) f.style.opacity = 0;
  b.p.stopVideo?.();
  toast('この端末では一部の背景動画が動かないため、静止画で表示しています');
}

// 2: WRAPは同じ動画を何本も流すので、初回だけ通信量の目安を伝える
function warnDataOnce() {
  if (store.get('dataWarned', false) || bgs.length < 2) return;
  store.set('dataWarned', true);
  setTimeout(() => toast(`周りの面にも同じ動画を流すため、通信量は約${bgs.length + 1}倍になります。モバイル通信では⚙で天井と床をオフにするか、AMBIENTにすると軽くなります`, 9000), 1500);
}

function onMainState(e) {
  const S = YT.PlayerState;
  document.body.classList.toggle('lit', e.data !== S.PLAYING && e.data !== S.BUFFERING);
  $('pp').textContent = e.data === S.PLAYING || e.data === S.BUFFERING ? '❚❚' : '▶';
  if (e.data === S.PLAYING) {
    $('ctl').classList.add('armed');
    keepAwake(true);
    for (const b of bgs) if (b.p.seekTo && !b.dead) seekBg(b, main.getCurrentTime());
    hideUiSoon();
  } else if (e.data === S.PAUSED || e.data === S.ENDED) {
    for (const b of bgs) { b.p.pauseVideo?.(); b.p.seekTo?.(main.getCurrentTime(), true); }
    keepAwake(false);
    showUi();
  }
}

function onMainError(e) {
  toast(e.data === 101 || e.data === 150 ? 'この動画は埋め込み再生が禁止されています' : 'この動画は再生できませんでした（エラー ' + e.data + '）', 5000);
  showUi();
}

// iPhoneはシークの完了が遅い。シーク後しばらくは触らず、ズレた分だけ先読み量(lead)を学習する
function seekBg(b, t) {
  b.el.classList.add('dip');
  clearTimeout(b.dipT); b.dipT = setTimeout(() => b.el.classList.remove('dip'), 2500);
  b.p.seekTo(t + b.lead, true);
  b.p.playVideo();
  b.hold = performance.now() + 2500;
  b.checked = false;
}

function sync() {
  if (!main?.getCurrentTime) return;
  const playing = main.getPlayerState() === YT.PlayerState.PLAYING, t = main.getCurrentTime();
  if (debugOn) $('debug').textContent = `主 ${t.toFixed(2)}  ` + bgs.map(b => `${b.el.dataset.key} ${(b.p.getCurrentTime?.() ?? 0).toFixed(2)}[${b.p.getPlayerState?.()}] +${b.lead.toFixed(2)}`).join('  ');
  if (!playing || document.hidden) return;
  const now = performance.now();
  for (const b of bgs) {
    if (b.dead || !b.p.getCurrentTime || now < b.hold) continue;
    if (!b.playing) {
      // 読み込み中は失敗に数えない（通信が遅いだけの場合がある）
      if (b.p.getPlayerState() !== YT.PlayerState.BUFFERING && ++b.fails >= 6) giveUp(b); else seekBg(b, t);
      continue;
    }
    const d = t - b.p.getCurrentTime();
    if (!b.checked) { b.checked = true; if (Math.abs(d) < 3) b.lead = Math.min(3, Math.max(0, b.lead + d)); }
    if (Math.abs(d) > 0.3) seekBg(b, t);
  }
}

const isPlaying = () => main?.getPlayerState?.() === YT.PlayerState.PLAYING;
let uiTimer;
function showUi() { $('bar').classList.remove('hide'); $('ctl').classList.add('show'); clearTimeout(uiTimer); }
function hideUi() { $('bar').classList.add('hide'); $('ctl').classList.remove('show'); $('settings').classList.remove('open'); }
const settingsOpen = () => $('settings').classList.contains('open');
function hideUiSoon() { clearTimeout(uiTimer); uiTimer = setTimeout(() => { if (isPlaying() && !settingsOpen()) hideUi(); }, 2800); }
function pokeUi() { showUi(); if (isPlaying()) hideUiSoon(); }
// 何もない所（壁・主画面）のタップで操作パネルを出し入れ
$('stage').addEventListener('click', e => {
  if (e.target.closest('button, input')) return;
  if (settingsOpen()) { $('settings').classList.remove('open'); return pokeUi(); }
  if ($('bar').classList.contains('hide')) pokeUi(); else if (isPlaying()) hideUi();
});
$('ctl').addEventListener('click', e => {
  e.stopPropagation();
  if (e.target.closest('button, input')) return pokeUi();
  if ($('ctl').classList.contains('show')) { if (isPlaying()) hideUi(); } else pokeUi();
});
$('pp').onclick = () => [YT.PlayerState.PLAYING, YT.PlayerState.BUFFERING].includes(main.getPlayerState()) ? main.pauseVideo() : main.playVideo();
const seekAll = t => { main.seekTo(t, true); if (!isPlaying()) bgs.forEach(b => b.p.seekTo?.(t, true)); };
$('back').onclick = () => seekAll(Math.max(0, main.getCurrentTime() - 10));
$('fwd').onclick = () => seekAll(main.getCurrentTime() + 10);
let dragging = false;
const fmt = t => { t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = String(t % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`; };
$('pos').addEventListener('input', e => { dragging = true; $('cur').textContent = fmt(+e.target.value); clearTimeout(uiTimer); });
$('pos').addEventListener('change', e => { dragging = false; seekAll(+e.target.value); pokeUi(); });
setInterval(() => {
  if (!main?.getDuration || !$('ctl').classList.contains('show') || dragging) return;
  const d = main.getDuration(), t = main.getCurrentTime();
  $('pos').max = d || 1; $('pos').value = t;
  $('cur').textContent = fmt(t); $('dur').textContent = fmt(d);
}, 250);

// 再生中は画面をスリープさせない
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (isPlaying()) keepAwake(true);
  else showUi(); // 共有でURLをコピーして戻ってきたとき、すぐ貼り付けられるように
});

function submit() {
  const id = parseId($('url').value);
  if (!id) return toast('YouTubeのURLとして読み取れませんでした');
  $('url').blur();
  play(id);
}
$('load').onclick = submit;
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
$('paste').onclick = async () => {
  try { $('url').value = await navigator.clipboard.readText(); submit(); }
  catch { toast('貼り付けできませんでした。入力欄を長押しして貼り付けてください'); }
};

buildLayers();
const q = new URLSearchParams(location.search);
const startId = parseId(q.get('v') || q.get('url') || '') || store.get('last', null);
if (startId) { $('url').value = 'https://youtu.be/' + startId; play(startId); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
</script>
</body>
</html>
